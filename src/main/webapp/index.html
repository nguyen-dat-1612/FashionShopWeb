<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng Nâng cao</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cart-item {
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 25px 30px; /* Tăng padding để kéo dài và rộng hơn */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .cart-item:hover {
            transform: translateY(-2px);
        }
        .quantity-controls button {
            width: 35px;
        }
        .size-select, .color-select {
            max-width: 100px;
        }
        .summary-card {
            position: sticky;
            top: 20px;
            border-radius: 10px;
        }
        .product-img {
            border-radius: 8px;
            object-fit: cover;
            width: 100px; /* Đảm bảo ảnh không quá nhỏ */
            height: 100px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            display: inline-block;
            border-radius: 4px;
            border: 1px solid #ddd;
            vertical-align: middle;
            margin-left: 5px;
        }
        .color-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .price-column {
            padding-right: 15px; /* Tăng padding để giá không sát viền */
            min-width: 120px; /* Tăng min-width để có thêm không gian */
        }
        /* Điều chỉnh khoảng cách giữa các cột */
        .cart-item .row > div {
            padding: 0 10px; /* Thêm padding cho các cột */
        }
        @media (max-width: ) {
            .price-column {
                min-width: auto;
                padding-right: 0;
            }
            .cart-item {
                padding: 15px; /* Giảm padding trên mobile */
            }
            .cart-item .row > div {
                padding: 0 5px; /* Giảm padding trên mobile */
            }
            .product-img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4 text-center">Giỏ Hàng Của Bạn</h1>
        
        <div class="row">
            <div class="col-lg-8">
                <div id="cart-items"></div>
            </div>
            
            <div class="col-lg-4">
                <div class="card summary-card">
                    <div class="card-body">
                        <h5 class="card-title">Thông tin đơn hàng</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Tạm tính:</span>
                            <span id="subtotal">0đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Phí vận chuyển:</span>
                            <span id="shipping">30,000đ</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold mb-3">
                            <span>Tổng cộng:</span>
                            <span id="total">0đ</span>
                        </div>
                        <button class="btn btn-success w-100" onclick="alert('Chức năng thanh toán đang phát triển!')">
                            Thanh Toán Ngay
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script>
        const cartItems = [
            { 
                id: 1, 
                name: "Áo thun thời trang", 
                price: 150000, 
                quantity: 1, 
                size: "M",
                color: "Xanh",
                availableSizes: ["S", "M", "L", "XL"],
                availableColors: [
                    {name: "Xanh", code: "#3498db"},
                    {name: "Đỏ", code: "#e74c3c"},
                    {name: "Đen", code: "#2c3e50"}
                ],
                image: "https://i1.sndcdn.com/artworks-ZbfKdYZBs6IDWBhJ-YxgJhQ-t500x500.jpg"
            },
            { 
                id: 2, 
                name: "Quần jeans cao cấp", 
                price: 250000, 
                quantity: 2, 
                size: "L",
                color: "Đen",
                availableSizes: ["M", "L", "XL"],
                availableColors: [
                    {name: "Xanh", code: "#2980b9"},
                    {name: "Đen", code: "#2c3e50"},
                    {name: "Xám", code: "#7f8c8d"}
                ],
                image: "https://i1.sndcdn.com/artworks-ZbfKdYZBs6IDWBhJ-YxgJhQ-t500x500.jpg"
            }
        ];
    
        function formatPrice(price) {
            return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "đ";
        }
    
        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            cartContainer.innerHTML = '';
    
            let subtotal = 0;
    
            cartItems.forEach(item => {
                subtotal += item.price * item.quantity;
    
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-2 col-3">
                            <img src="${item.image}" class="img-fluid product-img" alt="${item.name}">
                        </div>
                        <div class="col-md-3 col-9">
                            <h5 class="mb-1">${item.name}</h5>
                            <small class="text-muted">Đơn giá: ${formatPrice(item.price)}</small>
                        </div>
                        <div class="col-md-2 col-4">
                            <select class="form-select size-select" 
                                    onchange="updateSize(${item.id}, this.value)">
                                ${item.availableSizes.map(size => 
                                    `<option value="${size}" ${size === item.size ? 'selected' : ''}>
                                        ${size}
                                    </option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="col-md-2 col-4">
                            <div class="color-container">
                                <select class="form-select color-select" 
                                        onchange="updateColor(${item.id}, this.value)">
                                    ${item.availableColors.map(color => 
                                        `<option value="${color.name}" ${color.name === item.color ? 'selected' : ''}>
                                            ${color.name}
                                        </option>`
                                    ).join('')}
                                </select>
                                <span class="color-box" 
                                      style="background-color: ${item.availableColors.find(c => c.name === item.color).code}">
                                </span>
                            </div>
                        </div>
                        <div class="col-md-2 col-4">
                            <div class="quantity-controls">
                                <button class="btn btn-outline-primary" 
                                        onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span class="px-2">${item.quantity}</span>
                                <button class="btn btn-outline-primary" 
                                        onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <div class="col-md-1 col-2 ">
                            <span class="fw-bold">${formatPrice(item.price * item.quantity)}</span>
                            <button class="btn btn-danger btn-sm mt-2" 
                                    onclick="removeItem(${item.id})">Xóa</button>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(itemElement);
            });
    
            document.getElementById('subtotal').textContent = formatPrice(subtotal);
            document.getElementById('total').textContent = formatPrice(subtotal + 30000);
        }
    
        function updateQuantity(itemId, change) {
            const item = cartItems.find(item => item.id === itemId);
            if (item && (item.quantity + change) > 0 && (item.quantity + change) <= 10) {
                item.quantity += change;
                updateCart();
            }
        }
    
        function updateSize(itemId, newSize) {
            const item = cartItems.find(item => item.id === itemId);
            if (item) {
                item.size = newSize;
                updateCart();
            }
        }
    
        function updateColor(itemId, newColor) {
            const item = cartItems.find(item => item.id === itemId);
            if (item) {
                item.color = newColor;
                updateCart();
            }
        }
    
        function removeItem(itemId) {
            const index = cartItems.findIndex(item => item.id === itemId);
            if (index !== -1) {
                cartItems.splice(index, 1);
                updateCart();
            }
        }
    
        // Initial render
        updateCart();
    </script>
</body>
</html>
