<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Style - Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/product-detail.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .product-detail-container {
        margin: 40px 0;
      }
      .product-image img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        border-radius: 10px;
      }
      .product-info {
        padding: 20px;
      }
      .product-title {
        font-size: 28px;
        color: #333;
        margin-bottom: 15px;
      }
      .product-price {
        font-size: 24px;
        color: #d4a373;
        margin-bottom: 10px;
      }
      .product-stock {
        font-size: 14px;
        color: #666;
        margin-bottom: 10px;
      }
      .product-rating {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
      }
      .product-description {
        font-size: 16px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .option-group {
        margin-bottom: 20px;
      }
      .option-group label {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 5px;
        display: block;
      }
      .color-options,
      .size-options {
        display: flex;
        gap: 10px;
      }
      .color-btn,
      .size-btn {
        padding: 8px 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .color-btn.active,
      .size-btn.active {
        border-color: #d4a373;
        background-color: #d4a373;
        color: #fff;
      }
      .quantity-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .quantity-btn {
        width: 40px;
        height: 40px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
      }
      .quantity-input {
        width: 60px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 5px;
      }
      .btn-add-to-cart,
      .btn-buy-now {
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        transition: all 0.3s ease;
      }
      .btn-add-to-cart {
        background-color: #fff;
        border: 1px solid #d4a373;
        color: #d4a373;
      }
      .btn-add-to-cart:hover {
        background-color: #d4a373;
        color: #fff;
      }
      .btn-buy-now {
        background-color: #d4a373;
        border-color: #d4a373;
        color: #fff;
        margin-left: 10px;
      }
      .btn-buy-now:hover {
        background-color: #b88a5d;
        border-color: #b88a5d;
      }
      @media (max-width: 768px) {
        .product-image img {
          height: 300px;
        }
        .product-title {
          font-size: 22px;
        }
        .product-price {
          font-size: 20px;
        }
      }

      .deal-section {
        margin: 40px 0;
      }
      .title_deal {
        font-size: 20px;
        font-weight: 600;
        color: #333;
        margin-bottom: 15px;
      }
      .bundle {
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 15px;
        background: #fff;
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 15px;
      }
      .deal-item {
        position: relative;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        width: 140px;
        text-align: center;
      }
      .main-item {
        border-color: #d4a373;
      }
      .deal-item img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 5px;
        margin-bottom: 5px;
      }
      .deal-item input[type="checkbox"] {
        position: absolute;
        top: 5px;
        left: 5px;
      }
      .deal-info {
        position: relative;
      }
      .deal-name {
        font-size: 12px;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .deal-name .open-popup {
        background: none;
        border: none;
        font-size: 14px;
        cursor: pointer;
      }
      .deal-label {
        position: absolute;
        top: -30px;
        right: 5px;
        background: #ff4d4f;
        color: #fff;
        font-size: 10px;
        padding: 2px 5px;
        border-radius: 3px;
      }
      .deal-label span {
        margin-left: 3px;
      }
      .original-price {
        font-size: 12px;
        color: #999;
        text-decoration: line-through;
        margin: 2px 0;
      }
      .deal-price {
        font-size: 14px;
        color: #d4a373;
        margin: 2px 0;
      }
      .option-hover {
        display: none;
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        z-index: 10;
        width: 120px;
      }
      .deal-info:hover .option-hover {
        display: block;
      }
      .option-hover .color-options,
      .option-hover .size-options {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 5px;
      }
      .option-hover label {
        font-size: 12px;
        font-weight: 600;
      }
      .option-hover .color-option,
      .option-hover .size-option {
        font-size: 12px;
        padding: 3px 5px;
        border: 1px solid #ddd;
        border-radius: 3px;
        background: none;
        cursor: pointer;
      }
      .option-hover .color-option.active,
      .option-hover .size-option.active {
        background: #d4a373;
        color: #fff;
        border-color: #d4a373;
      }
      .plus-sign {
        font-size: 24px;
        color: #666;
        align-self: center;
      }
      .bundle-items {
        flex: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
      }
      .bundle-summary {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #eee;
      }
      .bundle-summary p {
        margin: 0;
        font-size: 14px;
      }
      .bundle-summary span {
        color: #d4a373;
        font-weight: 600;
      }
      .btn-deal {
        background-color: #d4a373;
        border-color: #d4a373;
        color: #fff;
        padding: 8px 15px;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }
      .btn-deal:hover {
        background-color: #b88a5d;
        border-color: #b88a5d;
      }
      @media (max-width: 768px) {
        .bundle {
          flex-direction: column;
        }
        .main-item {
          margin-bottom: 15px;
        }
        .plus-sign {
          display: none;
        }
        .bundle-items {
          justify-content: center;
        }
        .deal-item {
          width: 120px;
        }
        .deal-item img {
          width: 60px;
          height: 60px;
        }
        .bundle-summary {
          flex-direction: column;
          gap: 10px;
        }
        .selected-options {
          font-size: 12px;
          color: #666;
          margin-top: 5px;
        }
        .main-options {
          display: none;
          position: absolute;
          top: 100%;
          left: 50%;
          transform: translateX(-50%);
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 5px;
          padding: 10px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
          z-index: 10;
          width: 120px;
        }
        .deal-info:hover .main-options {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="header"></div>
    <!-- Product Detail Content -->
    <main class="container product-detail-container">
      <div class="row">
        <div class="col-md-6 product-image">
          <img id="productImage" alt="Product Image" />
        </div>
        <div class="col-md-6 product-info">
          <h1 class="product-title" id="productName"></h1>
          <p class="product-price" id="productPrice"></p>
          <p class="product-stock" id="productStock"></p>
          <p class="product-rating" id="productRating"></p>
          <p class="product-description" id="productDescription"></p>

          <!-- Chọn màu sắc -->
          <div class="option-group">
            <label>Màu sắc:</label>
            <div class="color-options" id="colorOptions"></div>
          </div>

          <!-- Chọn kích thước -->
          <div class="option-group">
            <label>Kích thước:</label>
            <div class="size-options" id="sizeOptions"></div>
          </div>

          <!-- Tăng giảm số lượng -->
          <div class="quantity-group">
            <label>Số lượng:</label>
            <button class="quantity-btn" id="decreaseQty">-</button>
            <input
              type="number"
              class="quantity-input"
              id="quantity"
              value="1"
              min="1"
            />
            <button class="quantity-btn" id="increaseQty">+</button>
          </div>

          <!-- Nút hành động -->
          <div class="action-buttons">
            <button class="btn btn-add-to-cart" id="addToCartBtn">
              Thêm vào giỏ hàng
            </button>
            <button class="btn btn-buy-now" id="buyNowBtn">Mua ngay</button>
          </div>
        </div>
      </div>
    </main>
    <!-- Deal sản phẩm -->
    <section class="deal-section">
      <h3 class="title_deal">Mua thêm deal sốc</h3>
      <div class="bundle">
        <div class="deal-item main-item">
          <img
            id="mainProductImage"
            src="https://product.hstatic.net/200000195587/product/ao-thun-bo-doi_d2094e7037d348c98b25252f1d805530_master.jpg"
            alt="Bộ quần áo bóng đá"
          />
          <div class="deal-info">
            <p class="deal-name">
              Bộ quần áo đá bóng Arsenal <button class="open-popup">🎨</button>
            </p>
            <p class="deal-label">Deal Sốc <span>-0%</span></p>
            <p class="original-price">180.000 VNĐ</p>
            <p class="deal-price">
              <strong id="mainProductPrice">180.000 VNĐ</strong>
            </p>
            <!-- Thêm tùy chọn màu sắc và kích thước cho sản phẩm chính -->
            <div class="option-hover main-options">
              <div class="color-options">
                <label>Màu sắc:</label>
                <button class="color-option">Đỏ</button>
                <button class="color-option">Xanh</button>
              </div>
              <div class="size-options">
                <label>Kích thước:</label>
                <button class="size-option">S</button>
                <button class="size-option">M</button>
                <button class="size-option">L</button>
              </div>
            </div>
            <!-- Hiển thị lựa chọn đã chọn -->
            <div class="selected-options" id="mainSelectedOptions"></div>
          </div>
        </div>
        <span class="plus-sign">+</span>
        <div class="bundle-items" id="bundleItems">
          <!-- Sản phẩm đi kèm -->
          <div class="deal-item">
            <input
              type="checkbox"
              class="deal-checkbox"
              data-price="100000"
              data-original="200000"
            />
            <img
              src="https://product.hstatic.net/200000195587/product/ao-thun-bo-doi_d2094e7037d348c98b25252f1d805530_master.jpg"
              alt="Quần short nam"
            />
            <div class="deal-info">
              <p class="deal-name">
                Quần short nam thể thao <button class="open-popup">🎨</button>
              </p>
              <p class="deal-label">Deal Sốc <span>-50%</span></p>
              <p class="original-price">200.000 VNĐ</p>
              <p class="deal-price"><strong>100.000 VNĐ</strong></p>
              <div class="option-hover">
                <div class="color-options">
                  <label>Màu sắc:</label>
                  <button class="color-option">Đen</button>
                  <button class="color-option">Xám</button>
                </div>
                <div class="size-options">
                  <label>Kích thước:</label>
                  <button class="size-option">S</button>
                  <button class="size-option">M</button>
                  <button class="size-option">L</button>
                </div>
              </div>
              <!-- Hiển thị lựa chọn đã chọn -->
              <div class="selected-options" id="bundleSelectedOptions1"></div>
            </div>
          </div>
        </div>
        <div class="bundle-summary">
          <p>
            <strong>Tổng cộng: <span id="comboTotal">180.000 VNĐ</span></strong>
          </p>
          <p>Tiết kiệm: <span id="comboDiscount">0 VNĐ</span></p>
          <button class="btn btn-buy-now" id="buyNowBtn" onclick="window.location.href='/src/main/webapp/pages/checkout.html'">Bấm để mua deal sốc</button>

        </div>
      </div>
    </section>
    <div id="footer"></div>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/main/webapp/assets/js/product-detail.js"></script>
  </body>
</html>
