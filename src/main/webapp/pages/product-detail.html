<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Style - Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/product-detail.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>   
      .product-detail-container {
        margin: 40px 0;
      }
    
    </style>
  </head>
  <body>
    <div id="header"></div>
    <!-- Product Detail Content -->
    <main class="container product-detail-container">
      <div class="row">
        <div class="col-md-6 product-image">
          <img id="productImage" alt="Product Image" />
        </div>
        <div class="col-md-6 product-info">
          <h1 class="product-title" id="productName"></h1>
          <p class="product-price" id="productPrice"></p>
          <p class="product-stock" id="productStock"></p>
          <p class="product-rating" id="productRating"></p>
          <p class="product-description" id="productDescription"></p>

          <!-- Chọn màu sắc -->
          <div class="option-group">
            <label>Màu sắc:</label>
            <div class="color-options" id="colorOptions"></div>
          </div>

          <!-- Chọn kích thước -->
          <div class="option-group">
            <label>Kích thước:</label>
            <div class="size-options" id="sizeOptions"></div>
          </div>

          <!-- Tăng giảm số lượng -->
          <div class="quantity-group">
            <label>Số lượng:</label>
            <button class="quantity-btn" id="decreaseQty">-</button>
            <input
              type="number"
              class="quantity-input"
              id="quantity"
              value="1"
              min="1"
            />
            <button class="quantity-btn" id="increaseQty">+</button>
          </div>

          <!-- Nút hành động -->
          <div class="action-buttons">
            <button class="btn-add-to-cart" id="addToCartBtn">
              Thêm vào giỏ hàng
            </button>
            <button class="btn-buy-now" id="buyNowBtn">Mua ngay</button>
          </div>
        </div>
      </div>
    </main>
    <!-- Deal sản phẩm -->
  

    <div id="loginAlert" class="alert alert-warning d-none" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
    
    </div>
   </div>
    <div id="footer"></div>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/main/webapp/assets/js/product-detail.js"></script>
  </body>
</html>
