<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thay Đổi Mật Khẩu - Fashion Store</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/change-password.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu -->
        <div class="sidebar">
            <div class="logo">
                <h2>FASHION <span>STYLE</span></h2>
            </div>
            <ul>
                <li id="profile" href="/src/main/webapp/pages/profile.html">THÔNG TIN CÁ NHÂN</li>
                <li class="active" href="/src/main/webapp/pages/change-password.html">MẬT KHẨU</li>
                <li id="orders" href="/src/main/webapp/pages/orders.html">DANH SÁCH ĐƠN HÀNG</li>
                <li id="logout" href = "/src/main/webapp/pages/home.html";>ĐĂNG XUẤT</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>THAY ĐỔI MẬT KHẨU</h2>
            <div class="profile-section">
                <div class="password-form">
                    <div class="info-row">
                        <label>Mật khẩu cũ</label>
                        <input type="password" id="old-password" placeholder="Nhập mật khẩu cũ">
                    </div>
                    <div class="info-row">
                        <label>Mật khẩu mới</label>
                        <input type="password" id="new-password" placeholder="Nhập mật khẩu mới">
                    </div>
                    <div class="info-row">
                        <label>Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirm-password" placeholder="Xác nhận mật khẩu mới">
                    </div>
                    <button class="save-btn" id="save-password">Lưu thay đổi</button>
                    <p id="message" style="color: #dc3545; display: none; margin-top: 10px;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/src/main/webapp/assets/js/change-password.js"></script>

    <script>
        // Xử lý chuyển trang khi click vào các mục sidebar
        document.querySelectorAll('.sidebar li').forEach(item => {
            const href = item.getAttribute('href');
            if (href) {
                item.style.cursor = 'pointer'; // Hiển thị cursor pointer
                item.addEventListener('click', () => {
                    window.location.href = href;
                });
            }
        });
        
        </script>
</body>
</html>
