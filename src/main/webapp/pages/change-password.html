<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thay Đổi Mật Khẩu - Fashion Store</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/change-password.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu -->
        <div class="sidebar">
            <div class="logo">
                <h2>FASHION <span>STYLE</span></h2>
            </div>
            <ul>
                <li id="profile">THÔNG TIN CÁ NHÂN</li>
                <li class="active">MẬT KHẨU</li>
                <li id="promotions">KHUYẾN MÃI DÀNH CHO BẠN</li>
                <li id="orders">DANH SÁCH ĐƠN HÀNG</li>
                <li id="verification">XÁC MINH TÀI KHOẢN</li>
                <li id="logout" logout>ĐĂNG XUẤT</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>THAY ĐỔI MẬT KHẨU</h2>
            <div class="profile-section">
                <div class="password-form">
                    <div class="info-row">
                        <label>Mật khẩu cũ</label>
                        <input type="password" id="old-password" placeholder="Nhập mật khẩu cũ">
                    </div>
                    <div class="info-row">
                        <label>Mật khẩu mới</label>
                        <input type="password" id="new-password" placeholder="Nhập mật khẩu mới">
                    </div>
                    <div class="info-row">
                        <label>Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirm-password" placeholder="Xác nhận mật khẩu mới">
                    </div>
                    <button class="save-btn" id="save-password">Lưu thay đổi</button>
                    <p id="message" style="color: #dc3545; display: none; margin-top: 10px;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/src/main/webapp/assets/js/change-password.js"></script>

    <script>
        document.getElementById("profile").addEventListener("click", function() {
            window.location.href = "/src/main/webapp/pages/profile.html";
        });
        document.getElementById("orders").addEventListener("click", function() {
        window.location.href = "/src/main/webapp/pages/orders.html";
    });
    </script>
</body>
</html>
