<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Style - Thanh Toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/main/webapp/assets/css/checkout.css">

</head>
<body>
    <div id="header"></div>

    <!-- Checkout Content -->
    <main class="checkout-container">
        <div class="row">
            <div class="col-md-7">
                <!-- Thông tin giao hàng -->
                <div class="shipping-info">
                    <h3 class="section-title">Thông tin giao hàng</h3>
                    <form id="checkoutForm">
                        <!-- <div class="form-group">
                            <label for="fullName">Họ và tên *</label>
                            <input type="text" id="fullName" required>
                        </div> -->
                        <div class="form-group">
                            <label for="phone">Số điện thoại *</label>
                            <input type="tel" id="phone" required>
                        </div>
                        <!-- <div class="form-group">
                            <label for="email">Email (tùy chọn)</label>
                            <input type="email" id="email">
                        </div> -->
                        <div class="form-group">
                            <label for="address">Địa chỉ giao hàng *</label>
                            <textarea id="address" rows="3" required></textarea>
                        </div>
                        <!-- <div class="form-group">
                            <label for="notes">Ghi chú đơn hàng (tùy chọn)</label>
                            <textarea id="notes" rows="2"></textarea>
                        </div> -->
                    </form>
                </div>

                <!-- Phương thức thanh toán -->
                <div class="payment-method">
                    <h3 class="section-title">Phương thức thanh toán</h3>
                    <div class="payment-option">
                        <input type="radio" id="cod" name="payment" value="COD" checked>
                        <label for="cod">Thanh toán khi nhận hàng (COD)</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="vnpay" name="payment" value="VNPAY">
                        <label for="vnpay">Chuyển khoản qua VNPAY</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="momo" name="payment" value="MOMO">
                        <label for="momo">Ví điện tử (Momo, ZaloPay)</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="credit_card" name="payment" value="CREDIT_CARD">
                        <label for="credit_card">Thanh toán qua thẻ tín dụng</label>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <!-- Tóm tắt đơn hàng -->
                <div class="order-summary">
                    <h3 class="section-title">Tóm tắt đơn hàng</h3>
                    <div id="orderItems"></div>
                    <div class="summary-details">
                        <p>Tạm tính: <span id="subTotal">0 VNĐ</span></p>
                        <p>Phí vận chuyển: <span id="shippingFee">30.000 VNĐ</span></p>
                        <p>Giảm giá: <span id="discount">0 VNĐ</span></p>
                    </div>
                    <p class="total-price">Tổng cộng: <span id="totalPrice">0 VNĐ</span></p>
                    <div class="discount-code">
                        <input type="text" id="discountCode" placeholder="Nhập mã giảm giá">
                        <button id="applyDiscount">Áp dụng</button>
                    </div>
                    <button class="btn-confirm" id="confirmOrder">Xác nhận đặt hàng</button>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/main/webapp/assets/js/checkout.js"></script>
</body>
</html>
