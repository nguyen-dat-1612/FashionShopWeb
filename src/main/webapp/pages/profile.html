<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân - Fashion Store</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/profile.css">
    <!-- Load sidebar.css -->

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu -->
        <div class="sidebar">
            <div class="logo">
                <a href="/src/main/webapp/pages/home.html">
                    <h2>FASHION <span>STYLE</span></h2>
                </a>
            </div>
            <ul>
                <li class="active" href="/src/main/webapp/pages/profile.html">THÔNG TIN CÁ NHÂN</li>
                <li id="changePassword" href="/src/main/webapp/pages/change-password.html">MẬT KHẨU</li>
                <li id="orders" href="/src/main/webapp/pages/orders.html">DANH SÁCH ĐƠN HÀNG</li>
                <li id="logout">ĐĂNG XUẤT</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>THÔNG TIN CÁ NHÂN</h2>
            <div class="profile-section">
                <div class="avatar">
                    <img src="https://via.placeholder.com/150" alt="Avatar" id="avatar-img">
                    <button class="edit-btn">Chỉnh sửa ảnh</button>
                </div>
                <div class="profile-info">
                    <div class="info-row">
                        <label>ID</label>
                        <span id="user-id"></span>
                    </div>
                    <div class="info-row">
                        <label>Họ và tên</label>
                        <input type="text" id="fullname" readonly>
                    </div>
                    <div class="info-row">
                        <label>Giới tính</label>
                        <select id="gender" disabled>
                            <option value="true">Nam</option>
                            <option value="false">Nữ</option>
                        </select>
                    </div>
                    <div class="info-row">
                        <label>Số điện thoại</label>
                        <input type="text" id="phone" readonly>
                    </div>
                    <div class="info-row">
                        <label>Email</label>
                        <input type="email" id="email" readonly>
                    </div>
                    <div class="info-row">
                        <label>Địa chỉ</label>
                        <input type="text" id="address" readonly>
                    </div>
                    <div class="info-row">
                        <label>Ngày sinh</label>
                        <input type="text" id="birthday" readonly>
                    </div>
                    <button class="save-btn">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/src/main/webapp/assets/js/profile.js"></script>
    
    <script>
        // Xử lý chuyển trang khi click vào các mục sidebar
        document.querySelectorAll('.sidebar li').forEach(item => {
            const href = item.getAttribute('href');
            if (href) {
                item.style.cursor = 'pointer'; // Hiển thị cursor pointer
                item.addEventListener('click', () => {
                    window.location.href = href;
                });
            }
        });
        
        </script>
</body>
</html>
