<!-- cart.html -->
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng - Fashion Style</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/main/webapp/assets/css/cart.css" />
  </head>
  <body>
    <div id="header"></div>
    <!-- Main Content -->
    <main class="container py-5">
      <h1 class="mb-4 text-center">Giỏ Hàng Của Bạn</h1>
      <div class="row">
        <div class="col-lg-8">
          <div class="mb-3">
            <input
              type="checkbox"
              id="select-all"
              checked
              onchange="toggleSelectAll()"
            />
            <label for="select-all" class="ms-2">Chọn tất cả</label>
          </div>
          <div id="cart-items"></div>
        </div>
        <div class="col-lg-4">
          <div class="card summary-card">
            <div class="card-body">
              <h5 class="card-title">Thông tin đơn hàng</h5>
              <div class="d-flex justify-content-between mb-2">
                <span>Tạm tính:</span>
                <span id="subtotal">0 VNĐ</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Phí vận chuyển:</span>
                <span id="shipping">30,000 VNĐ</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fw-bold mb-3">
                <span>Tổng cộng:</span>
                <span id="total">0 VNĐ</span>
              </div>
              <button
                class="btn btn-primary w-100"
                onclick="window.location.href='/src/main/webapp/pages/checkout.html'"
              >
                Đặt Hàng
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="/src/main/webapp/assets/js/cart.js"></script>
  </body>
</html>
