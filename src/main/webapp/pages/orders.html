<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Đơn Hàng - Fashion Store</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/orders.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu -->
        <div class="sidebar">
            <div class="logo">
                <a href="/src/main/webapp/pages/home.html">
                    <h2>FASHION <span>STYLE</span></h2>
                </a>
            </div>
            <ul>
                <li id="profile" href="/src/main/webapp/pages/profile.html">THÔNG TIN CÁ NHÂN</li>
                <li id="changePassword" href="/src/main/webapp/pages/change-password.html">MẬT KHẨU</li>
                <li class="active" href="/src/main/webapp/pages/orders.html">DANH SÁCH ĐƠN HÀNG</li>
                <li id="logout">ĐĂNG XUẤT</li>
            </ul>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <h2>DANH SÁCH ĐƠN HÀNG</h2>
            
            <div class="filter-container">
                <button class="filter-btn active" data-status="PENDING">Đang chờ</button>
                <button class="filter-btn" data-status="CONFIRMED">Đã xác nhận</button>
                <button class="filter-btn" data-status="DELIVERING">Đang giao</button>
                <button class="filter-btn" data-status="DELIVERED">Đã giao</button>
                <button class="filter-btn" data-status="CANCELLED">Đã hủy</button>
            </div>
            
            <div class="orders-container" id="orders-list">
                <!-- Danh sách đơn hàng sẽ được tải ở đây -->
            </div>
        </div>
    </div>

    <script src="/src/main/webapp/assets/js/orders.js"></script>
    <script>
        document.querySelectorAll('.sidebar li').forEach(item => {
            const href = item.getAttribute('href');
            if (href) {
                item.style.cursor = 'pointer'; // Hiển thị cursor pointer
                item.addEventListener('click', () => {
                    window.location.href = href;
                });
            }
        });
        
    </script>
</body>
</html>
