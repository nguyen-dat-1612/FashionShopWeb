<!-- order-detail.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Đơn Hàng - Fashion Store</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/orders.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<body>
    <div class="container">
        <!-- Sidebar Menu (giữ nguyên từ orders.html) -->
        <div class="sidebar">
            <div class="logo">
                <a href="/src/main/webapp/pages/home.html">
                    <h2>FASHION <span>STYLE</span></h2>
                </a>
            </div>
            <ul>
                <li id="profile" href="/src/main/webapp/pages/profile.html">THÔNG TIN CÁ NHÂN</li>
                <li id="changePassword" href="/src/main/webapp/pages/change-password.html">MẬT KHẨU</li>
                <li class="active" href="/src/main/webapp/pages/orders.html">DANH SÁCH ĐƠN HÀNG</li>
                <li id="logout">ĐĂNG XUẤT</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>CHI TIẾT ĐƠN HÀNG</h2>
            <div class="order-detail-section">
                <div class="order-info">
                    <p><strong>Mã đơn hàng:</strong> <span id="order-id"></span></p>
                    <p><strong>Ngày đặt:</strong> <span id="order-date"></span></p>
                    <p><strong>Trạng thái:</strong> <span id="order-status"></span></p>
                </div>
                <table class="order-items-table">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Kích thước</th>
                            <th>Màu sắc</th>
                            <th>Số lượng</th>
                            <th>Đơn giá</th>
                            <th>Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody id="order-items"></tbody>
                </table>
                <p class="order-total"><strong>Tổng tiền:</strong> <span id="order-total"></span></p>
                <div id="cancel-order-section"></div>
                <button class="btn-back" onclick="window.location.href='/src/main/webapp/pages/orders.html'">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- Modal thông báo -->
    <div id="notification-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-icon success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <div class="modal-icon error-icon" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h3 id="modal-title">Thông báo</h3>
            <p id="modal-message">Nội dung thông báo</p>
            <div class="modal-buttons">
                <button id="modal-confirm" class="btn-primary">Xác nhận</button>
                <button id="modal-cancel" class="btn-secondary">Hủy</button>
            </div>
        </div>
    </div>

    <script src="/src/main/webapp/assets/js/order-detail.js"></script>
    <script>
        document.querySelectorAll('.sidebar li').forEach(item => {
            const href = item.getAttribute('href');
            if (href) {
                item.style.cursor = 'pointer'; // Hiển thị cursor pointer
                item.addEventListener('click', () => {
                    window.location.href = href;
                });
            }
        });
        
    </script>
</body>
</html>
