<!-- order-detail.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Đơn Hàng - Fashion Store</title>
    <link rel="stylesheet" href="/src/main/webapp/assets/css/orders.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS bổ sung để đồng bộ với orders.css */
        .order-info {
            background-color: #f9f1e7;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .order-info p {
            font-size: 14px;
            margin: 5px 0;
            color: #666;
        }
        .order-info p strong {
            color: #333;
        }
        .order-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .order-items-table th, .order-items-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .order-items-table th {
            background-color: #f9f1e7;
            color: #666;
            font-weight: 600;
        }
        .order-total {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        .btn-cancel {
            background-color: #dc3545;
            border: none;
            color: #fff;
            padding: 8px 15px; /* Kích thước rõ ràng, đồng bộ với detail-btn */
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-right: 10px;
            font-size: 14px; /* Đồng bộ kích thước chữ */
        }
        .btn-cancel:hover {
            background-color: #b02a37;
        }
        .btn-back {
            background-color: #d4a373;
            border: none;
            color: #fff;
            padding: 8px 15px; /* Kích thước rõ ràng, đồng bộ với detail-btn */
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 14px; /* Đồng bộ kích thước chữ */
        }
        .btn-back:hover {
            background-color: #b88a5d;
        }
        #cancel-order-section {
            display: inline-block;
        }
        
    
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu (giữ nguyên từ orders.html) -->
        <div class="sidebar">
            <div class="logo">
                <a href="/src/main/webapp/pages/home.html">
                    <h2>FASHION <span>STYLE</span></h2>
                </a>
            </div>
            <ul>
                <li id="profile" href="/src/main/webapp/pages/profile.html">THÔNG TIN CÁ NHÂN</li>
                <li id="changePassword" href="/src/main/webapp/pages/change-password.html">MẬT KHẨU</li>
                <li class="active" href="/src/main/webapp/pages/orders.html">DANH SÁCH ĐƠN HÀNG</li>
                <li id="logout">ĐĂNG XUẤT</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>CHI TIẾT ĐƠN HÀNG</h2>
            <div class="order-detail-section">
                <div class="order-info">
                    <p><strong>Mã đơn hàng:</strong> <span id="order-id"></span></p>
                    <p><strong>Ngày đặt:</strong> <span id="order-date"></span></p>
                    <p><strong>Trạng thái:</strong> <span id="order-status"></span></p>
                </div>
                <table class="order-items-table">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Kích thước</th>
                            <th>Màu sắc</th>
                            <th>Số lượng</th>
                            <th>Đơn giá</th>
                            <th>Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody id="order-items"></tbody>
                </table>
                <p class="order-total"><strong>Tổng tiền:</strong> <span id="order-total"></span></p>
                <div id="cancel-order-section"></div>
                <button class="btn-back" onclick="window.location.href='/src/main/webapp/pages/orders.html'">Quay lại</button>
            </div>
        </div>
    </div>

    <script src="/src/main/webapp/assets/js/order-detail.js"></script>
    <script>
        document.querySelectorAll('.sidebar li').forEach(item => {
            const href = item.getAttribute('href');
            if (href) {
                item.style.cursor = 'pointer'; // Hiển thị cursor pointer
                item.addEventListener('click', () => {
                    window.location.href = href;
                });
            }
        });
        
    </script>
</body>
</html>
